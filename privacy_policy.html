      border-radius: 0 10px 10px 0;
      padding: 20px 24px;

      font-size: 18px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 2px solid #E5E5E5;

      font-size: 15px;
      color: #3A3A3A;
      margin-bottom: 10px;
    }
    section ul {
      padding-left: 20px;
      margin-bottom: 10px;
    }
    section ul li {
      font-size: 15px;
      color: #3A3A3A;
      margin-bottom: 6px;
    }

      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 14px;
    }
    .permission-table th {
      background: #F0F0F0;
      text-align: left;
      padding: 10px 14px;
      font-weight: 600;
      color: #444444;
    }
    .permission-table td {
      padding: 10px 14px;
      border-bottom: 1px solid #EEEEEE;
      color: #3A3A3A;
      vertical-align: top;
    }
    .permission-table tr:last-child td { border-bottom: none; }

    .contact-box {
      background: #F5F5F5;
      border-radius: 12px;
      padding: 24px;
      margin-top: 8px;
    }
    .contact-box p {
      margin-bottom: 6px;
      font-size: 15px;
    }

    .contact-box a:hover { text-decoration: underline; }

    footer {
      text-align: center;
      padding: 32px 24px;
      font-size: 13px;
      color: #AAAAAA;
      border-top: 1px solid #EEEEEE;

function detectLang() {
  const l = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  if (l.startsWith('ko')) return 'ko';
  if (l.startsWith('ja')) return 'ja';
  if (l === 'zh-tw' || l === 'zh-hk' || l.includes('hant')) return 'zh-TW';
  if (l.startsWith('zh')) return 'zh-TW';
  if (l.startsWith('pt')) return 'pt-BR';
  if (l.startsWith('es')) return 'es';
  return 'en';
}

function setText(id, text) { document.getElementById(id).textContent = text; }
function setHTML(id, html) { document.getElementById(id).innerHTML = html; }

function apply(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;

  setText('header-chip', t.chip);
  setText('header-h1', t.h1);
  setHTML('summary', t.summary);

  setText('s1-h2', t.s1.h2);
  setText('s1-intro', t.s1.intro);
  document.getElementById('s1-list').innerHTML = t.s1.list.map(i => `<li>${i}</li>`).join('');
  setText('s1-note', t.s1.note);

  setText('s2-h2', t.s2.h2);
  setText('s2-th1', t.s2.th1);
  setText('s2-th2', t.s2.th2);
  document.getElementById('s2-tbody').innerHTML = t.s2.perms.map(p =>
    `<tr><td><code>${p.name}</code><br><small>${p.ver}</small></td><td>${p.desc}</td></tr>`
  ).join('');
  setText('s2-note', t.s2.note);

  setText('s3-h2', t.s3.h2);
  setText('s3-p1', t.s3.p1);
  setText('s3-p2', t.s3.p2);

  setText('s4-h2', t.s4.h2);
  setText('s4-p',  t.s4.p);

  setText('s5-h2', t.s5.h2);
  setText('s5-p',  t.s5.p);

  setText('s6-h2', t.s6.h2);
  setText('s6-p',  t.s6.p);

  setText('s7-h2',    t.s7.h2);
  setText('s7-intro', t.s7.intro);
  setHTML('s7-contact', t.s7.contact);

  setText('footer', t.footer);
}
